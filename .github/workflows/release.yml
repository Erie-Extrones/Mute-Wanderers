# Publishes a GitHub Release with one jar per supported Minecraft version.
#
# Trigger it by pushing a tag of the form v<mod_version>, e.g.
#     git tag v1.0.0 && git push origin v1.0.0
# or run it manually from the Actions tab with "Use workflow from" set to that tag.
# The mod version baked into the jars comes from the tag (v1.0.0 -> 1.0.0), so the
# jars are always named rankmute-<tag>+mc<minecraft>.jar regardless of gradle.properties.
#
# The Minecraft targets live in build.yml's matrix.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Derive version from tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: derive mod version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ] || [ "${REF_NAME#v}" = "$REF_NAME" ]; then
            echo "::error::This workflow must run from a tag named v<version> (got ${REF_TYPE} '${REF_NAME}')."
            exit 1
          fi
          version="${REF_NAME#v}"
          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing RankMute $version (prerelease=$prerelease)"

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      mod_version: ${{ needs.prepare.outputs.version }}

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: download jars
        uses: actions/download-artifact@v8
        with:
          pattern: rankmute-mc*
          path: dist
          merge-multiple: true

      - name: select release assets
        run: |
          rm -f dist/*-sources.jar
          ls -l dist
          test -n "$(ls dist/*.jar 2>/dev/null)"

      - name: write release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "## Downloads"
            echo
            echo "| Minecraft | File |"
            echo "|-----------|------|"
            for jar in dist/*.jar; do
              name=$(basename "$jar")
              mc=${name##*+mc}
              mc=${mc%.jar}
              echo "| $mc | \`$name\` |"
            done
            echo
            echo "Requires Fabric Loader 0.19.5+ and Fabric API. Drop the jar for your Minecraft version into \`mods/\`."
            echo
          } > notes.md
          cat notes.md

      - name: create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: RankMute ${{ needs.prepare.outputs.version }}
          body_path: notes.md
          append_body: true
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          files: dist/*.jar
          fail_on_unmatched_files: true
